name: Build APK

on:
  push:
    branches: [main]
  # A pull request is checked (tests and a build) but never published.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (plan rules against the printed tables)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build check (pull requests only, never published)
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew --no-daemon assembleDebug
          ./gradlew --no-daemon -Pplay processReleaseManifest
          f=$(find app/build/intermediates -path '*merged_manifest*' -path '*release*' -name AndroidManifest.xml | head -1)
          echo "Play manifest: $f"; test -n "$f"
          if grep -q REQUEST_INSTALL_PACKAGES "$f"; then echo "::error::Play build still asks to install packages"; exit 1; fi

      - name: Screenshots of every screen
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -Pshots recordPaparazziDebug
          mkdir -p shots
          for f in $(find app -path '*snapshots/images*' -name '*.png'); do
            n=$(basename "$f" .png); cp "$f" "shots/screen-${n##*_}.png"
          done
          ls shots

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Every release must be signed with the same key, or Android refuses
          # to install it over the previous version. Stop rather than publish
          # an APK signed with a throwaway key.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: fisudur
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "fi-sudur-1.0.${{ github.run_number }}.apk"

      - name: Google Play bundle (no self-updater)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: fisudur
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon -Pplay bundleRelease

      - name: Keep the Play bundle with this run
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fi-sudur-play-1.0.${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # Only a commit marked [release] (or a manual run) reaches phones through the
          # in-app updater. Everything else is a pre-release: built and testable, never offered.
          channel="--prerelease"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "$MSG" | grep -q "\[release\]"; then
            channel="--latest"
          fi
          gh release create "v1.0.${{ github.run_number }}" "fi-sudur-1.0.${{ github.run_number }}.apk" $(ls shots/*.png 2>/dev/null) \
            $channel \
            --title "في صدور 1.0.${{ github.run_number }}" \
            --notes "$(if [ -s release-notes.txt ]; then cat release-notes.txt; else git log -1 --pretty=%s | sed 's/ *\[release\]//'; fi)

          versionCode=${{ github.run_number }}"
