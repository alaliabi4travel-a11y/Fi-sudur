name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (plan rules against the printed tables)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Screenshots of every screen
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -Pshots recordPaparazziDebug
          mkdir -p shots
          for f in $(find app -path '*snapshots/images*' -name '*.png'); do
            n=$(basename "$f" .png); cp "$f" "shots/screen-${n##*_}.png"
          done
          ls shots

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Every release must be signed with the same key, or Android refuses
          # to install it over the previous version. Stop rather than publish
          # an APK signed with a throwaway key.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: fisudur
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "fi-sudur-1.0.${{ github.run_number }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "fi-sudur-1.0.${{ github.run_number }}.apk" $(ls shots/*.png 2>/dev/null) \
            --title "في صدور 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)

          versionCode=${{ github.run_number }}"
